name: Publish GitHub Release

on:
  push:
    branches:
      - main
    paths:
      - "RightMenu-*.dmg"
      - "RightMenu-*.zip"
      - "RightMenu-*.md"
      - "appcast.xml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rightmenu-github-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out release files
        uses: actions/checkout@v5

      - name: Resolve version and files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          disk_images=(RightMenu-*.dmg)
          test "${#disk_images[@]}" -eq 1
          dmg_name="${disk_images[0]}"
          version="${dmg_name#RightMenu-}"
          version="${version%.dmg}"
          archive="RightMenu-$version.zip"
          notes="RightMenu-$version.md"

          test -f "$archive"
          test -f "$notes"
          test -f appcast.xml
          grep -Fq "$archive" appcast.xml

          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"
          echo "DMG=$dmg_name" >> "$GITHUB_ENV"
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
          echo "NOTES=$notes" >> "$GITHUB_ENV"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "RightMenu $VERSION" \
              --notes-file "$NOTES"
            gh release delete-asset "$TAG" "$ARCHIVE" --yes >/dev/null 2>&1 || true
            gh release delete-asset "$TAG" appcast.xml --yes >/dev/null 2>&1 || true
            gh release upload "$TAG" "$DMG" --clobber
          else
            gh release create "$TAG" \
              "$DMG" \
              --target main \
              --title "RightMenu $VERSION" \
              --notes-file "$NOTES"
          fi

          asset_names="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          test "$asset_names" = "$DMG" || {
            echo "GitHub Release must expose only the expected RightMenu DMG." >&2
            printf 'Actual assets:\n%s\n' "$asset_names" >&2
            exit 1
          }
